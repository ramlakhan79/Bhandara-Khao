<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>You're offline | Bhandara Khao</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background:#faf8f5; color:#1c1917; }
    main { max-width:420px; text-align:center; }
    .logo { width:64px; height:64px; border-radius:16px; background:#c74c07; color:#fff; display:inline-flex; align-items:center; justify-content:center; font-size:32px; }
    h1 { font-size:22px; margin:20px 0 8px; }
    p { line-height:1.6; color:#57534e; margin:0 0 20px; }
    button { min-height:44px; padding:0 22px; border:0; border-radius:10px; background:#c74c07; color:#fff; font-size:16px; font-weight:600; cursor:pointer; }
    @media (prefers-color-scheme: dark) { body { background:#0c0a09; color:#f5f5f4; } p { color:#a8a29e; } button { background:#ff9d37; color:#0c0a09; } }
  </style>
</head>
<body>
  <main>
    <div class="logo" aria-hidden="true">🍛</div>
    <h1>You're offline</h1>
    <p>Bhandara timings and locations change often, so we don't show saved copies as if they were live. Please reconnect to see the latest events.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
